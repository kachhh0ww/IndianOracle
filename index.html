<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Indian Oracle</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
url("background.jpg.png");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

}

.container{

width:400px;

background:rgba(18,22,30,.82);

backdrop-filter:blur(15px);

padding:35px;

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

color:white;

box-shadow:0 10px 40px rgba(0,0,0,.5);

}

h1{

text-align:center;

margin-bottom:8px;

font-size:30px;

}

p{

text-align:center;

color:#b7bec8;

margin-bottom:25px;

font-size:14px;

}

input{

width:100%;

padding:14px;

margin-bottom:15px;

border:none;

border-radius:10px;

background:#111827;

color:white;

font-size:15px;

outline:none;

}

input:focus{

border:1px solid #ff4655;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#ff4655;

color:white;

font-size:16px;

cursor:pointer;

font-weight:600;

transition:.25s;

}

button:hover{

background:#ff5c6a;

}

#result{

margin-top:25px;

text-align:center;

font-size:20px;

line-height:1.7;

}

small{

display:block;

margin-top:20px;

text-align:center;

color:#8b95a4;

}

</style>

</head>

<body>

<div class="container">

<h1>🔮 Indian Oracle</h1>

<p>Minimal VALORANT Match Predictor</p>

<input id="team1" placeholder="Enter Team 1">

<input id="team2" placeholder="Enter Team 2">

Predict Match

</button>

<div id="result"></div>

<small>
For entertainment purposes only.
</small>

</div>

<script>

function predict(){

let team1=document.getElementById("team1").value.trim();

let team2=document.getElementById("team2").value.trim();

if(team1==""||team2==""){

document.getElementById("result").innerHTML="Please enter both team names.";

return;

}

let winner=Math.random()<0.5?team1:team2;

let chance=Math.floor(Math.random()*21)+80;

document.getElementById("result").innerHTML=

`🏆 <b>${winner}</b><br>
<div style="font-size:34px;color:#ff4655;font-weight:700;">${chance}%</div>
<div style="font-size:14px;color:#b7bec8;">Win Probability</div>`;

}

</script>

</body>
</html>
